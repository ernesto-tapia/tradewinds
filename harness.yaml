github:
  repository: ernesto-tapia/tradewinds
  base: main
jira:
  url: https://etapm94.atlassian.net
  cloud_id: cf753471-eeed-4a75-a187-b03675c1e8bc
  jql: 'labels = "caribbean-tradewinds" ORDER BY key ASC'
  stages:
    developing: ["En curso", "In Progress"]
    reviewing: ["En revisión", "In Review"]
    done: ["Finalizada", "Listo", "Done", "Hecho"]
agents:
  provider: ollama
  fallback: codex
  model: gpt-6.1-sol
  reasoning_effort: medium
ollama:
  protocol: json_actions
  url: http://localhost:11434
  developer: qwen2.5-coder:7b
  qa: qwen2.5-coder:7b
  context: 8192
  max_output_tokens: 2048
limits:
  repairs: 3
  turns: 30
  no_progress: 3
  report_attempts: 2
  command_seconds: 180
  model_seconds: 300
  poll_seconds: 60
codex: codex
godot: godot
godot_version: "4.5.1"
export_artifact: build/CaribbeanTradewinds.exe
asset_policy: labeled_boxes
check_dependencies:
  scene: [validate]
  smoke: [validate, scene]
  export: [validate, scene, smoke]
permissions:
  developer: ["game/", "docs/game/", "tests/game/"]
  qa: ["tests/game/"]
commands:
  validate: ["{godot}", "--headless", "--path", "game", "--editor", "--import", "--quit"]
  scene: ["{godot}", "--headless", "--path", "game", "--script", "{harness_root}/scripts/check_scene.gd"]
  smoke: ["{godot}", "--headless", "--path", "game", "--quit-after", "120"]
  export: ["{godot}", "--headless", "--path", "game", "--export-release", "Windows Desktop", "../build/CaribbeanTradewinds.exe"]
stories:
  KAN-8:
    guidance: prompts/stories/KAN-8.md
  KAN-9:
    guidance: prompts/stories/KAN-9.md
    commands:
      feature: ["{godot}", "--headless", "--path", "game", "--script", "{harness_root}/scripts/check_kan9.gd"]
    check_dependencies:
      feature: [validate, scene]
      smoke: [validate, scene, feature]
      export: [validate, scene, feature, smoke]
